# ============================================================================
# Edge function JWT verification policy
# ----------------------------------------------------------------------------
# verify_jwt = false : public/external callers — must do their own auth in code
# verify_jwt = true  : invoked from the authenticated web app (Supabase client)
# ============================================================================

# --- Public / external webhook endpoints (verify_jwt = false) ---------------

[functions.submit-seller-lead]
verify_jwt = false  # Public seller lead capture form on hosted seller websites

[functions.speed-to-lead]
verify_jwt = false  # Internal trigger from submit-seller-lead + cron processor (validates x-internal-secret or service-role bearer)

[functions.process-scheduled-calls]
verify_jwt = false  # pg_cron HTTP trigger; validates x-internal-secret in code

[functions.vapi-webhook]
verify_jwt = false  # Inbound from Vapi (validates x-vapi-secret in code)

[functions.closebot-webhook]
verify_jwt = false  # Inbound from Closebot

[functions.twilio-webhook]
verify_jwt = false  # Inbound from Twilio — X-Twilio-Signature HMAC-SHA1 validated in code

[functions.twilio-recording]
verify_jwt = false  # Inbound from Twilio — X-Twilio-Signature HMAC-SHA1 validated in code

[functions.twilio-twiml]
verify_jwt = false  # Inbound from Twilio — X-Twilio-Signature HMAC-SHA1 validated in code

[functions.lob-webhook]
verify_jwt = false  # Inbound from Lob — Lob-Signature HMAC-SHA256 + timestamp replay window validated in code

[functions.buyer-portal-auth]
verify_jwt = false  # Public buyer portal auth (magic link); handles its own validation

[functions.submit-deal]
verify_jwt = false  # Public deal submission form; per-IP rate limit + Turnstile

[functions.submit-deal-interest]
verify_jwt = false  # Public "interested in this deal" form; per-IP rate limit + Turnstile

[functions.track-website-event]
verify_jwt = false  # Public seller-website analytics beacon; per-IP rate cap

[functions.stripe-webhook]
verify_jwt = false  # Inbound from Stripe — Stripe-Signature HMAC validated in code

