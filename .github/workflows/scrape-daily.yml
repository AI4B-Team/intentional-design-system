name: Scrape County Records — Daily (High Priority)

on:
  schedule:
    # Run at 3:00 AM CDT daily (8:00 AM UTC)
    # Matches Q Quentin Flores' proven timing
    - cron: '0 8 * * *'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      state:
        description: 'State to scrape (e.g. TX). Leave blank for all.'
        required: false
        default: ''
      county:
        description: 'County to scrape (e.g. harris). Leave blank for all.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no Supabase writes)'
        required: false
        default: 'false'

jobs:
  scrape-daily:
    name: Scrape Priority 1-2 Counties
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install Python dependencies
        working-directory: scrapers
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        working-directory: scrapers
        run: python -m playwright install chromium --with-deps

      - name: Create output directories
        run: mkdir -p scrapers/output/logs

      - name: Run scraper
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ORGANIZATION_ID: ${{ secrets.ORGANIZATION_ID }}
        run: |
          STATE_ARG=""
          COUNTY_ARG=""
          DRY_RUN_ARG=""

          if [ -n "${{ github.event.inputs.state }}" ]; then
            STATE_ARG="--state ${{ github.event.inputs.state }}"
          fi

          if [ -n "${{ github.event.inputs.county }}" ]; then
            COUNTY_ARG="--county ${{ github.event.inputs.county }}"
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi

          python run.py \
            --priority 2 \
            --cadence 24 \
            $STATE_ARG \
            $COUNTY_ARG \
            $DRY_RUN_ARG \
            2>&1 | tee output/logs/scrape-$(date +%Y-%m-%d).log

      - name: Show scrape summary
        working-directory: scrapers
        if: always()
        run: |
          echo "=== Scrape Results ==="
          cat output/logs/scrape-$(date +%Y-%m-%d).log | tail -30

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-logs-${{ github.run_number }}
          path: scrapers/output/logs/
          retention-days: 14
